# ShadowTrace: `cp .env.example .env`, set ST_SECRET_KEY (and optional feed keys), then `docker compose up -d --build`.
# Web UI on http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shadowtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadowtrace}
      POSTGRES_DB: shadowtrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowtrace"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      ST_DATABASE_URL: postgresql+psycopg://shadowtrace:${POSTGRES_PASSWORD:-shadowtrace}@db:5432/shadowtrace
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Single scheduler process: bootstraps MITRE + curation, then polls all feeds and runs correlation.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      ST_DATABASE_URL: postgresql+psycopg://shadowtrace:${POSTGRES_PASSWORD:-shadowtrace}@db:5432/shadowtrace
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
