# Curated enrichment layered on top of MITRE ATT&CK.
#
# `match` is the MITRE group name or any alias. If nothing matches, the group is created as a
# curated-only group (e.g. hacktivist personas that ATT&CK does not track).
#
# states[].relation:   sponsor | operated_by | aligned | alleged
# states[].confidence: confirmed (government attribution / indictment / sanctions)
#                      high (consistent multi-vendor assessment) | medium | low
# relations[].type:    subgroup | overlap | collaboration | shared_tooling | same_agency | persona
#
# Keep claims sourced. Prefer government attributions; label vendor-only assessments as such.

groups:
  # ───────────────────────────── Russia ─────────────────────────────
  - match: APT28
    motivation: espionage
    summary: >-
      Russian military intelligence (GRU) unit conducting political and military espionage, hack-and-leak
      influence operations and, occasionally, close-access operations against NATO governments, militaries,
      elections and international organisations.
    target_countries: [US, UA, DE, FR, GB, PL, GE, NL]
    target_sectors: [government, military, political parties, media, international organisations]
    states:
      - {country: RU, relation: operated_by, agency: "GRU Unit 26165 (85th Main Special Service Center)", confidence: confirmed,
         source_name: "US DOJ indictment, 13 Jul 2018", source_url: "https://www.justice.gov/opa/pr/grand-jury-indicts-12-russian-intelligence-officers-hacking-offenses-related-2016-election"}
    relations:
      - {target: Sandworm Team, type: same_agency, description: "Both are GRU units (26165 and 74455); the 2018 DOJ indictment charged officers of both units.", confidence: confirmed}
    history:
      - {date: 2015-04-08, title: "TV5Monde broadcast sabotage", kind: operation,
         description: "French broadcaster TV5Monde taken off air under a fake 'CyberCaliphate' persona; French investigators later linked the attack to APT28.", source_name: "ANSSI / press reporting"}
      - {date: 2015-05-01, precision: month, title: "German Bundestag network compromise", kind: operation,
         description: "Intrusion into the Bundestag network; Germany later issued an arrest warrant for a GRU officer and the EU imposed sanctions (Oct 2020).", source_name: "EU Council sanctions, Oct 2020"}
      - {date: 2016-04-01, precision: month, title: "DNC / DCCC hack-and-leak", kind: operation,
         description: "Theft of Democratic Party emails and their release through DCLeaks and Guccifer 2.0 personas ahead of the 2016 US election."}
      - {date: 2018-04-13, title: "OPCW close-access operation disrupted", kind: disclosure,
         description: "Dutch MIVD disrupted four GRU officers attempting to hack the OPCW's Wi-Fi in The Hague; publicly disclosed in October 2018."}
      - {date: 2018-07-13, title: "US indictment of 12 GRU officers", kind: indictment,
         source_url: "https://www.justice.gov/opa/pr/grand-jury-indicts-12-russian-intelligence-officers-hacking-offenses-related-2016-election"}
      - {date: 2024-05-03, title: "Germany attributes SPD email campaign", kind: disclosure,
         description: "German government publicly attributed the 2023 compromise of SPD executive email accounts (Outlook CVE-2023-23397) to APT28."}

  - match: APT29
    motivation: espionage
    summary: >-
      Russian foreign intelligence (SVR) actor focused on long-term, stealthy intelligence collection from
      governments, diplomatic bodies, think tanks and technology supply chains.
    target_countries: [US, GB, DE, UA, PL, NL, BE]
    target_sectors: [government, diplomacy, think tanks, technology, healthcare]
    states:
      - {country: RU, relation: operated_by, agency: "Foreign Intelligence Service (SVR)", confidence: confirmed,
         source_name: "US/UK attribution of SolarWinds compromise, 15 Apr 2021"}
    history:
      - {date: 2020-07-16, title: "COVID-19 vaccine research targeted", kind: disclosure,
         description: "UK NCSC, Canada CSE and US NSA jointly warned that APT29 was targeting vaccine research organisations."}
      - {date: 2020-12-13, title: "SolarWinds SUNBURST supply-chain compromise disclosed", kind: disclosure,
         description: "Trojanised Orion updates gave access to ~18,000 organisations; a small subset of high-value government and technology targets was exploited."}
      - {date: 2021-04-15, title: "US and UK formally attribute SolarWinds to SVR", kind: sanction}
      - {date: 2024-01-19, title: "Microsoft corporate email breach disclosed", kind: disclosure,
         description: "Microsoft disclosed that Midnight Blizzard accessed senior leadership mailboxes via a password-spray of a legacy test tenant."}

  - match: Sandworm Team
    motivation: destructive
    summary: >-
      GRU's most destructive unit: power-grid attacks in Ukraine, NotPetya, Olympic Destroyer, and wartime
      operations synchronised with Russian military objectives. Tracked by Google/Mandiant as APT44.
    target_countries: [UA, GE, US, FR, KR, PL]
    target_sectors: [energy, telecommunications, government, logistics, media]
    states:
      - {country: RU, relation: operated_by, agency: "GRU Unit 74455 (Main Center for Special Technologies, GTsST)", confidence: confirmed,
         source_name: "US DOJ indictment, 19 Oct 2020", source_url: "https://www.justice.gov/opa/pr/six-russian-gru-officers-charged-connection-worldwide-deployment-destructive-malware-and"}
    history:
      - {date: 2015-12-23, title: "Ukrainian power grid attack (BlackEnergy)", kind: operation,
         description: "First publicly confirmed cyberattack to cause a power outage: ~225,000 customers in western Ukraine lost power."}
      - {date: 2016-12-17, title: "Industroyer / CrashOverride hits Kyiv substation", kind: operation,
         description: "Purpose-built grid malware caused an outage in part of Kyiv."}
      - {date: 2017-06-27, title: "NotPetya", kind: operation,
         description: "Destructive worm seeded via Ukrainian accounting software M.E.Doc; global damages estimated above US$10 billion."}
      - {date: 2018-02-09, title: "Olympic Destroyer", kind: operation,
         description: "Wiper attack on the PyeongChang Winter Olympics opening ceremony with false flags pointing at North Korea."}
      - {date: 2019-10-28, title: "Mass defacement of Georgian websites", kind: operation,
         description: "~15,000 Georgian websites defaced and broadcasters disrupted; attributed to GRU by UK, US and others in Feb 2020."}
      - {date: 2020-10-19, title: "US indictment of six Unit 74455 officers", kind: indictment}
      - {date: 2022-04-08, title: "Industroyer2 attack on Ukrainian grid thwarted", kind: operation,
         description: "Attempted attack on high-voltage substations, detected and stopped with CERT-UA and ESET."}
      - {date: 2022-10-10, title: "OT attack causes outage alongside missile strikes", kind: operation,
         description: "Mandiant reported a Sandworm OT intrusion that tripped substations and caused an unplanned outage coinciding with mass Russian missile strikes on Ukrainian energy infrastructure."}
      - {date: 2023-12-12, title: "Kyivstar telecom destruction", kind: operation,
         description: "Destructive attack on Ukraine's largest mobile operator, cutting service for ~24 million subscribers; attributed by SBU to Sandworm."}

